[project]
name = "agent-harness"
version = "0.1.0"
description = "Tool-using ReAct agents for coding and chess"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "modal>=1.5.3",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "swe-rex[modal]",
    "boto3>=1.43", # Used by the SWE-rex Modal backend for ECR authentication.
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
agent-harness-chess-modal = "agent_harness.chess_sandbox:main"
agent-harness-code = "agent_harness.cli:run_code_agent"
agent-harness-doctor = "agent_harness.doctor:main"
agent-harness-chess = "agent_harness.cli:run_chess_agent"
agent-harness-swebench = "agent_harness.cli:run_swebench_agent"

[tool.pytest.ini_options]
markers = ["modal: spins up a real Modal sandbox (slow, billable)"]
addopts = "-m 'not modal'"
# The chess_app submodule ships its own suite, which runs in the testbed against
# the installed package. Collecting it here would fail and is not this repo's job.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
